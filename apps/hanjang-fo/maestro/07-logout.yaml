appId: com.hanjang.fo
---
- launchApp:
    clearState: true
- openLink: "hanjang://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 60000
- tapOn: "Continue"
- runFlow:
    when:
      visible: "Fast refresh"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "카카오로 시작"
    timeout: 30000
- openLink: "hanjang://auth/kakao?access=${MAESTRO_ACCESS_TOKEN}&refresh=${MAESTRO_REFRESH_TOKEN}"
- extendedWaitUntil:
    visible: "오늘의 퀴즈"
    timeout: 30000
- tapOn: { point: "361,815" }
- assertVisible: "로그아웃"
- tapOn: "로그아웃"
- assertVisible: "카카오로 시작"
- takeScreenshot: 07-logout
