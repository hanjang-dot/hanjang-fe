appId: com.hanjang.fo
---
- launchApp:
    clearState: true
- openLink: "hanjang://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 60000
- tapOn: "Continue"
- runFlow:
    when:
      visible: "Fast refresh"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "카카오로 시작"
    timeout: 30000
- openLink: "hanjang://auth/kakao?access=${MAESTRO_ACCESS_TOKEN}&refresh=${MAESTRO_REFRESH_TOKEN}"
- extendedWaitUntil:
    visible: "오늘의 퀴즈"
    timeout: 30000
- tapOn: { point: "120,815" }
- assertVisible: "E2E 모의고사"
- tapOn: "북마크"
- tapOn: { point: "200,815" }
- assertVisible: "E2E 모의고사"
- assertVisible: "북마크됨"
- takeScreenshot: 06-saved
